stages:
  - lint
  - build
  - test
  - deploy

variables:
  IMAGE_TAG: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
  IMAGE_LATEST: ${CI_REGISTRY_IMAGE}:latest

lint:
  stage: lint
  image: alpine:3.19
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages yamllint
  script:
    - yamllint -d relaxed .gitlab-ci.yml
    - yamllint -d relaxed helm/ejemplo-angular/values.yaml
    - yamllint -d relaxed helm/ejemplo-angular/Chart.yaml
    - yamllint -d relaxed k8s/*.yaml
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-lint:
  stage: lint
  image: alpine/helm:3.14
  script:
    - helm lint helm/ejemplo-angular/
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  image: gcr.io/kaniko-project/executor:v1.21.0-debug
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context ${CI_PROJECT_DIR} --dockerfile ${CI_PROJECT_DIR}/Dockerfile --destination ${IMAGE_TAG} --destination ${IMAGE_LATEST} --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: test
  image: node:12
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends chromium
    - export CHROME_BIN=$(which chromium)
  script:
    - npm install --legacy-peer-deps
    - npx ng test --watch=false --browsers=ChromeHeadless
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-staging:
  stage: deploy
  image: alpine/helm:3.14
  script:
    - helm upgrade --install ejemplo-angular-staging helm/ejemplo-angular/ --namespace staging --create-namespace --set image.repository=${CI_REGISTRY_IMAGE} --set image.tag=${CI_COMMIT_SHORT_SHA} --wait --timeout 5m
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual

deploy-production:
  stage: deploy
  image: alpine/helm:3.14
  script:
    - helm upgrade --install ejemplo-angular-production helm/ejemplo-angular/ --namespace production --create-namespace --set image.repository=${CI_REGISTRY_IMAGE} --set image.tag=${CI_COMMIT_SHORT_SHA} --wait --timeout 5m
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  when: manual
