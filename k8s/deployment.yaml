apiVersion: apps/v1
kind: Deployment
metadata:
  name: ejemplo-angular
  labels:
    app: ejemplo-angular
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ejemplo-angular
  template:
    metadata:
      labels:
        app: ejemplo-angular
    spec:
      containers:
        - name: ejemplo-angular
          image: registry.gitlab.com/amauryortega/ejemplo-angular:latest
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
