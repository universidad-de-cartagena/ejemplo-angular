apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ejemplo-angular
spec:
  podSelector:
    matchLabels:
      app: ejemplo-angular
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
